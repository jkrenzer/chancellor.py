# Git symbolic links; with core.symlinks=false they check out as plain files, and the
# whitespace fixers would append a newline to the link target.
exclude: ^\.claude/(agents|skills)$

# `pre-commit install` also installs the commit-msg hook that checks Conventional Commits.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace

  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort

  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2
    hooks:
      - id: autopep8

  # Plugin versions match poetry.lock; .mdformat.toml holds the settings.
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm==1.0.0
          - mdformat-gfm-alerts==2.1.0
          - mdformat-myst==0.3.0
          - mdformat-front-matters==2.0.0
          - mdformat-footnote==0.1.3

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.41
    hooks:
      - id: pymarkdown

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
