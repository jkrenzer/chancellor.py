[tool.poetry]
name = "chancellor"
version = "0.1.0"
description = "Keeps project records as data and renders them into documents, incrementally and deterministically."
authors = ["jkrenzer <jkrenzer@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "chancellor", from = "src" }]
keywords = [
  "documentation",
  "records",
  "decision-records",
  "requirements",
  "specifications",
  "jinja2",
  "incremental-build",
  "mcp",
]
include = [
  { path = "src/chancellor/templates/**/*", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.11"
jinja2 = "^3.1"
pydantic = "^2"
"ruamel.yaml" = "^0.18"
markdown-it-py = "^3"
mdit-py-plugins = "^0.6.1"
typer = "^0.27"
dulwich = { version = "^1.2.20", optional = true }
mcp = { version = "^2", optional = true }

[tool.poetry.extras]
git = ["dulwich"]
mcp = ["mcp"]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
autopep8 = "^2.3.2"
pylint = "^4.1.3"
pymarkdownlnt = "^0.9.41"
mdformat = "^1.0.0"
mdformat-gfm = "^1.0.0"
pytest = "^9.1.1"
pre-commit = "^4.7.0"
conventional-pre-commit = "^4.4.0"
poethepoet = "^0.49.0"
bump-my-version = "^1.6.7"

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2"
myst-parser = "^4.0"
sphinx-markdown-builder = "^0.6.11"

[tool.poetry.scripts]
chancellor = "chancellor.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.autopep8]
max_line_length = 88

[tool.isort]
profile = "black"

[tool.pylint.messages_control]
disable = [
  "C0114",
  "C0115",
  "C0116",
]

[tool.pymarkdown]
plugins.md013.line_length = 100
plugins.md041.enabled = false
extensions.front-matter.enabled = true

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore(release): bump version {current_version} -> {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/chancellor/__init__.py"

[tool.poe.tasks]
format = [
  { cmd = "black src tests" },
  { cmd = "isort src tests" },
]
lint = [
  { cmd = "black --check src tests" },
  { cmd = "isort --check-only src tests" },
  { cmd = "pylint src/chancellor tests" },
  { cmd = "pymarkdown scan ." },
]
test = "pytest"
docs = "sphinx-build -b html .agents/context _build/docs"
docs-md = "sphinx-build -b markdown .agents/context _build/docs-md"
prek = "pre-commit run --all-files --show-diff-on-failure"
publish = "poetry publish --build"
release-patch = "bump-my-version bump patch"
release-minor = "bump-my-version bump minor"
release-major = "bump-my-version bump major"
