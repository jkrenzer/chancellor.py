[project]
name = "chancellor"
dynamic = ["version"]
description = "Keeps project records as data and renders them into documents, incrementally and deterministically."
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Jörn Krenzer", email = "jkrenzer@users.noreply.github.com" }]
keywords = [
  "documentation",
  "records",
  "decision-records",
  "requirements",
  "specifications",
  "jinja2",
  "incremental-build",
  "mcp",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "jinja2>=3.1,<4.0",
  "pydantic>=2,<3",
  "ruamel.yaml>=0.18,<0.19",
  "markdown-it-py>=3,<4",
  "mdit-py-plugins>=0.6.1,<0.7",
  "typer>=0.27,<0.28",
  "mcp>=2,<3",
  # mdformat shapes the bytes chancellor writes, so it is pinned narrowly; a golden test
  # catches an upgrade that changes output.
  "mdformat>=1.0.0,<1.1",
  "mdformat-gfm>=1.0.0,<1.1",
  "pydantic-settings>=2.16,<3",
  "rfc8785>=0.1.4,<0.2",
  # Parses and orders PEP 440 versions for the builtin.pep440 version scheme.
  "packaging>=24,<27",
]

[project.optional-dependencies]
git = ["dulwich>=1.2.20,<2"]

[project.scripts]
chancellor = "chancellor.cli:run"

[project.urls]
Homepage = "https://github.com/jkrenzer/chancellor.py"
Repository = "https://github.com/jkrenzer/chancellor.py"
Issues = "https://github.com/jkrenzer/chancellor.py/issues"
Changelog = "https://github.com/jkrenzer/chancellor.py/releases"

[dependency-groups]
dev = [
  "black>=26.10.1,<27",
  "isort>=9.0.2,<10",
  "autopep8>=2.3.2,<3",
  "pylint>=4.1.3,<5",
  "pymarkdownlnt>=0.9.41,<0.10",
  "mdformat-gfm-alerts>=2.1.0,<3",
  "mdformat-myst>=0.3.0,<0.4",
  "pytest>=9.1.1,<10",
  "pre-commit>=4.7.0,<5",
  "conventional-pre-commit>=4.4.0,<5",
  "poethepoet>=0.49.0,<0.50",
  "bump-my-version>=1.6.7,<2",
]
docs = [
  "sphinx>=8.2,<9",
  "myst-parser>=4.0,<5",
  "sphinx-markdown-builder>=0.6.11,<0.7",
]

[build-system]
requires = ["poetry-core>=2.3,<3", "poetry-dynamic-versioning>=1.10,<2"]
build-backend = "poetry_dynamic_versioning.backend"

# Only what no packaging standard covers yet: the src layout, shipping the built-in providers, and
# the version field poetry-dynamic-versioning requires.
[tool.poetry]
requires-poetry = ">=2.3,<3"
packages = [{ include = "chancellor", from = "src" }]
include = [
  { path = "src/chancellor/builtin/**/*", format = ["sdist", "wheel"] },
]
# Last released version, kept by bump-my-version. Builds take their version from the git tag via
# poetry-dynamic-versioning; the release workflow checks that both agree. Must stay the last key:
# the plugin writes it back at the end of the table when it restores this file after a build.
version = "0.1.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.10,<2", extras = ["plugin"] }

# Version from git: the tag on a release commit (0.1.0), the next patch as a dev release with the
# commit hash in between (0.1.1.dev3+g9f2c1ab). Archive downloads read .git_archival.json.
[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
style = "pep440"
# Tags are written by bump-my-version as v{new_version}; this preset requires the v prefix.
pattern = "default"
format-jinja = """
{%- if distance == 0 -%}
{{ base }}
{%- else -%}
{{ serialize_pep440(bump_version(base), dev=distance, metadata=["g" ~ commit]) }}
{%- endif -%}
"""

# chancellor.__version__ reads the installed metadata, so no source file needs rewriting.
[tool.poetry-dynamic-versioning.substitution]
files = []

[tool.black]
line-length = 88
target-version = ["py311"]

# Must stay equal to black's line-length, or the two pre-commit hooks undo each other's work.
[tool.autopep8]
max_line_length = 88

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests"]

[tool.pylint.messages_control]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
]

# Pipelines such as the project load and the build read better as one sequence than split to
# satisfy pylint's default size limits; these limits fit them.
[tool.pylint.design]
max-args = 8
max-positional-arguments = 6
max-locals = 25
max-returns = 8
max-branches = 15
max-attributes = 20
min-public-methods = 0

# chancellor.api is the public surface and stays one module, documented as one.
[tool.pylint.format]
max-module-lines = 1200

[tool.pymarkdown]
plugins.md013.line_length = 100
plugins.md013.code_block_line_length = 100
extensions.front-matter.enabled = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bumpversion]
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
# Annotated tags; pre-releases must use PEP 440 spelling (1.0.0rc1) for the tag pattern to match.
tag_message = "chore(release): {new_version}"
message = "chore(release): bump version {current_version} -> {new_version}"

# Anchored regex: a plain `version = "…"` search would also match `current_version = "…"`.
# Matches the version in [tool.poetry]; [project] declares it dynamic.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = "^version = \"{current_version}\""
replace = "version = \"{new_version}\""

[tool.poe.tasks]
# mdformat cannot exclude gitignored paths on Python < 3.13, so it gets git's file list.
# Settings live in .mdformat.toml.
format = [
  { cmd = "autopep8 --in-place --recursive src tests docs/conf.py" },
  { cmd = "isort src tests docs/conf.py" },
  { cmd = "black src tests docs/conf.py" },
  { shell = "git ls-files -co --exclude-standard -- '*.md' | while read -r f; do [ -e \"$f\" ] && printf '%s\\0' \"$f\"; done | xargs -0 -r mdformat" },
  { cmd = "pymarkdown fix -r --respect-gitignore ." },
]
lint = [
  { cmd = "black --check src tests docs/conf.py" },
  { cmd = "isort --check-only src tests docs/conf.py" },
  { cmd = "pylint src/chancellor tests docs/conf.py" },
  { shell = "git ls-files -co --exclude-standard -- '*.md' | while read -r f; do [ -e \"$f\" ] && printf '%s\\0' \"$f\"; done | xargs -0 -r mdformat --check" },
  { cmd = "pymarkdown scan -r --respect-gitignore ." },
]
test = "pytest"
docs = "sphinx-build -W --keep-going -b html docs docs/_build/html"
docs-md = "sphinx-build -W --keep-going -b markdown docs docs/_build/markdown"
prek = "pre-commit run --all-files --show-diff-on-failure"
sign-cla = { cmd = "python cla/sign.py", help = "Write your CLA signature record" }
publish = "poetry publish --build"
release-patch = "bump-my-version bump patch"
release-minor = "bump-my-version bump minor"
release-major = "bump-my-version bump major"
